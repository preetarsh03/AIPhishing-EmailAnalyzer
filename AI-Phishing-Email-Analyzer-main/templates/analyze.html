
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3>AI Phishing Email Analyzer</h3>
            </div>

            <div class="card-body">
                <form action="/analyze-email" method="POST" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Upload Email (.eml)</label>
                        <input type="file" class="form-control" name="email_file">
                    </div>

                    <h5 class="text-center">OR</h5>

                    <div class="mb-3">
                        <label class="form-label">Paste Email Content</label>
                        <textarea class="form-control"
                                  rows="10"
                                  name="email_text"
                                  placeholder="Paste complete email here..."></textarea>
                    </div>

                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-success">
                            Analyze Email
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>
    <style>

    background: radial-gradient(circle at top left, #172554, #080d1f 55%, #030712);
    color: #f8fafc;
    font-family: 'Segoe UI', sans-serif;

    color: #67e8f9;
    text-shadow: 0 0 15px rgba(34, 211, 238, 0.35);

    border: 1px solid rgba(103, 232, 249, 0.22);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(12px);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

    transform: translateY(-4px);
    box-shadow: 0 18px 40px rgba(34, 211, 238, 0.12);
}

    max-width: 100%;
    box-sizing: border-box;

    border-radius: 10px;
    padding: 12px;

    padding: 12px 22px;

    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;

button:hover, input[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 22px rgba(34, 211, 238, 0.35);
}

    color: #67e8f9;
}

@media (max-width: 600px) {
    form, .container, .card {
        padding: 16px;
    }
}
