<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze Email</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>AI Phishing Email Analyzer</h3>
        </div>

        <div class="card-body">

            <form action="/analyze-email" method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Upload Email (.eml)</label>
                    <input type="file" class="form-control" name="email_file">
                </div>

                <h5 class="text-center">OR</h5>

                <div class="mb-3">
                    <label class="form-label">Paste Email Content</label>

                    <textarea
                        class="form-control"
                        rows="10"
                        name="email_text"
                        placeholder="Paste complete email here..."></textarea>
                </div>

                <button class="btn btn-success">
                    Analyze Email
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
